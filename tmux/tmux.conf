if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g default-command "$SHELL"

set -g mouse on

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
# set -g @plugin 'nhdaly/tmux-better-mouse-mode'
# set -g @plugin 'omerxx/tmux-sessionx'
# set -g @sessionx-bind 'o'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# catppuccin config — auto-detect macOS appearance (mocha=dark, latte=light)
# On load/reload: clear state so the script always runs the full update.
# On focus: hook runs the script with state-file check to avoid redundant updates.
set-hook -g client-focus-in "run-shell '~/.dotfiles/scripts/tmux-theme-check.sh'"
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"


# v2 settings
set -g @catppuccin_directory_text "#{s|$HOME|~|:pane_current_path}"

run-shell "rm -f ~/.cache/tmux-flavor && ~/.dotfiles/scripts/tmux-theme-check.sh"
run-shell "~/.dotfiles/scripts/tmux-theme-watcher.sh &"

set -g status-right-length 100
set -g status-left-length 100
set -g status-justify centre
set -g status-left "#{E:@catppuccin_status_session}"
set -g @catppuccin_date_time_text " %H:%M"
set -gF status-right "#{E:@catppuccin_status_date_time}"

set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

## disabling auto rename on tmux
set-option -g allow-rename off

#  Binding keys
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

set -ga terminal-overrides ',*:Tc'

# update windows index when they gone
set-option -g renumber-windows on

# 0 is too far from ` ;)
set-option -g base-index 1
set-window-option -g pane-base-index 1

set -g history-limit 1000000

#VIM LIKE
set -g status-keys vi
set-window-option -g mode-keys vi

setw -g mode-style "reverse"

unbind [
bind m copy-mode

unbind f
bind f resize-pane -Z

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-no-clear "pbcopy"\; display-message "copied to system clipboard"
bind -T copy-mode-vi MouseDown1Pane if-shell -F "#{pane_active}" "send -X clear-selection" "select-pane -t ="
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-no-clear "pbcopy"

set -g pane-border-status bottom
set -g pane-border-format "#[align=right]#{?pane_active,#[fg=colour6 bg=default]\ue0b6#[fg=#161719 bg=colour6] #{pane_current_command} #[fg=colour6 bg=default]\ue0b4,#[fg=colour8 bg=default] #{pane_current_command} }"

bind-key v split-window -h -c '#{pane_current_path}'
bind-key s split-window -v -c '#{pane_current_path}'

# increase pane size
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r H resize-pane -L 5
bind-key -r L resize-pane -R 5

# move panes with h+j+k+l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind S swap-window -t -1\; select-window -t -1
bind N command-prompt -p "New session name:" "new-session -s '%%'"
bind R command-prompt -p "Rename session:" "rename-session '%%'"
bind o display-popup -E -w 40% -h 25% -b none "~/.dotfiles/scripts/tmux-sessions.sh"

# Reload tmux config
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# New windows
bind c new-window

# clear history
bind y send-keys -R \; send-keys C-l \; clear-history

set-option -g status-interval 2

## Join windows: <prefix> s, <prefix> j
bind-key B break-pane

## Avoid scrolling down after entering copy mode
unbind -T copy-mode-vi MouseDragEnd1Pane

# Undercurl
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

set-option -g set-titles on
set-option -g set-titles-string "#{s|$HOME|~|:pane_current_path}"

set -g status-position top

run ~/.tmux/plugins/tmux-cpu/cpu.tmux
run ~/.tmux/plugins/tmux-battery/battery.tmux

run '~/.tmux/plugins/tpm/tpm'
